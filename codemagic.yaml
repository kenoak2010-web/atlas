# Cloud build for the ATLAS iOS app (no Mac needed). Step-by-step setup: docs/APP_STORE.md
#
# Before the first build, in Codemagic:
#   1. Team settings → Integrations → Developer Portal: add an App Store Connect API key
#      and name it exactly "ATLAS App Store Connect".
#   2. In App Store Connect, create the app with the bundle ID below.
workflows:
  ios-testflight:
    name: ATLAS iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: ATLAS App Store Connect
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.kenoak2010.atlas
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Copy web shell and plugins into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
